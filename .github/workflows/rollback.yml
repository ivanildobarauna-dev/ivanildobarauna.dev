name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (e.g., 1.0.3). Leave empty to auto-detect previous release.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  prepare-rollback:
    name: Determine version and prepare rollback bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rollback_version: ${{ steps.version.outputs.rollback_version }}
      rollback_tag: ${{ steps.version.outputs.rollback_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: |
          LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${LOWER}" >> "$GITHUB_ENV"

      - name: Determine rollback version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ROLLBACK_VERSION="${{ github.event.inputs.version }}"
          else
            # Releases are ordered newest-first; .[1] is the one before the current
            ROLLBACK_VERSION=$(gh release list --limit 2 --json tagName --jq '.[1].tagName')
            ROLLBACK_VERSION=${ROLLBACK_VERSION#v}
          fi
          if [ -z "$ROLLBACK_VERSION" ]; then
            echo "ERROR: Could not determine rollback version. No previous release found."
            exit 1
          fi
          echo "rollback_version=${ROLLBACK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "rollback_tag=v${ROLLBACK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ROLLBACK_VERSION=${ROLLBACK_VERSION}" >> "$GITHUB_ENV"
          echo "Rolling back to version: ${ROLLBACK_VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare rollback bundle
        run: |
          mkdir -p deploy
          echo "DD_API_KEY=${{ secrets.DATADOG_API_KEY }}" > deploy/.env
          cat > deploy/docker-compose.rollback.yaml << 'EOF'
          services:
            frontend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ env.ROLLBACK_VERSION }}
              container_name: portfolio-frontend
              environment:
                - DD_SERVICE=ivanildobarauna.dev
                - DD_ENV=production
                - DD_VERSION=${{ env.ROLLBACK_VERSION }}
                - DD_TRACE_SAMPLE_RATE=1.0
                - DD_AGENT_HOST=localhost
                - DD_PROCESS_AGENT_ENABLED=true
                - DD_TAGS="app:portfolio,tech:nextjs,role:frontend"
              labels:
                com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "ivanildobarauna.dev"}]'
                tags.env: "production"
                tags.service: "ivanildobarauna.dev"
                tags.tech: "nextjs"
                tags.app: "portfolio"
                tags.role: "frontend"
              depends_on:
                - backend
              restart: unless-stopped
              network_mode: host
              healthcheck:
                test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 60s

            backend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ env.ROLLBACK_VERSION }}
              container_name: portfolio-backend
              environment:
                - POSTGRES_HOST=localhost
                - DD_SERVICE=api.ivanildobarauna.dev
                - DD_ENV=production
                - DD_VERSION=${{ env.ROLLBACK_VERSION }}
                - DD_TRACE_SAMPLE_RATE=1.0
                - DD_AGENT_HOST=localhost
                - DD_PROCESS_AGENT_ENABLED=true
                - DD_TAGS="app:portfolio,tech:python,role:backend"
                - DD_RUNTIME_METRICS_ENABLED=true
              labels:
                com.datadoghq.ad.logs: '[{"source": "python", "service": "api.ivanildobarauna.dev"}]'
                tags.env: "production"
                tags.service: "api.ivanildobarauna.dev"
                tags.tech: "python"
                tags.app: "portfolio"
                tags.role: "backend"
              restart: unless-stopped
              network_mode: host
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/ping"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 60s
          EOF

      - name: Upload rollback bundle
        uses: actions/upload-artifact@v4
        with:
          name: site-rollback-bundle
          path: deploy/
          retention-days: 1

  deploy:
    needs: prepare-rollback
    uses: ivanildobarauna/github-workflows/.github/workflows/deploy-compose-ssh.yml@v1
    with:
      artifact-name: site-rollback-bundle
      compose-file: docker-compose.rollback.yaml
      remote-path: /home/ubuntu/app/site
      environment: Production
    secrets:
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

  post-rollback:
    name: Mark release as latest and open revert PR
    needs: [prepare-rollback, deploy]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write
      pull-requests: write
    env:
      ROLLBACK_VERSION: ${{ needs.prepare-rollback.outputs.rollback_version }}
      ROLLBACK_TAG: ${{ needs.prepare-rollback.outputs.rollback_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT }}

      - name: Mark rollback release as latest
        run: |
          gh release edit "${ROLLBACK_TAG}" --latest
          echo "Release ${ROLLBACK_TAG} marked as latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create rollback PR
        run: |
          PR_BRANCH="rollback/${ROLLBACK_VERSION}"

          # Configure git identity for the revert commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Start from main HEAD (not from the tag)
          git checkout -b ${PR_BRANCH} main

          # Replace application files with the content from the rollback tag,
          # excluding infrastructure/docs paths (aligned with deploy paths-ignore)
          git checkout ${ROLLBACK_TAG} -- .

          # Restore paths that should NOT be rolled back (same as deploy paths-ignore)
          git checkout main -- .github/ docs/ tests/ README.md CHANGELOG.md LICENSE docker-compose.local.yaml '*.md' 2>/dev/null || true

          # Check if there are actual differences
          if git diff --cached --quiet && git diff --quiet; then
            echo "WARNING: No differences between main and ${ROLLBACK_TAG}. Nothing to rollback."
            exit 0
          fi

          # Commit the revert
          git add -A
          git commit -m "rollback: revert codebase to v${ROLLBACK_VERSION}

          This reverts the codebase to the state at tag ${ROLLBACK_TAG}.
          The VPS has already been rolled back to this version."

          # Force push (in case branch already exists from a previous attempt)
          git push origin ${PR_BRANCH} --force

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head ${PR_BRANCH} --base main --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            # Create new PR
            gh pr create \
              --base main \
              --head ${PR_BRANCH} \
              --title "Rollback: Revert to v${ROLLBACK_VERSION}" \
              --body "Automatic Rollback PR - This PR reverts the codebase to v${ROLLBACK_VERSION} to match the environment rollback. Review the changes carefully and merge to update main with the previous stable version. This PR was automatically created by the Rollback workflow."
          else
            echo "PR #${EXISTING_PR} already exists for this rollback"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
