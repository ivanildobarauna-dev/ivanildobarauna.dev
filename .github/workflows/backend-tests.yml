name: Run backend tests
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'docker-compose.local.yaml'
      - 'frontend/**'
      - 'docker-compose.prod.yaml'

jobs:
  test:
    uses: ivanildobarauna/github-workflows/.github/workflows/tests-python-poetry.yml@v1
    with:
      python-versions: '["3.11"]'
      working-directory: backend
      run-codecov: false
