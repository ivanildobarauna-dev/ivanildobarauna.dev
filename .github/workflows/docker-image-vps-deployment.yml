name: Site Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/**'
      - '.github/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'docker-compose.local.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-package:
    name: Build images and prepare deploy bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute next release version
        id: version
        run: |
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // "v0.9.9"')
          LATEST=${LATEST#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "Computed version: ${NEW_VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=raw,value=${{ env.NEW_VERSION }}
            type=raw,value=latest

      - name: Build and push Frontend image
        id: push-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=raw,value=${{ env.NEW_VERSION }}
            type=raw,value=latest

      - name: Build and push Backend image
        id: push-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Generate artifact attestation for Frontend
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          subject-digest: ${{ steps.push-frontend.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation for Backend
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          subject-digest: ${{ steps.push-backend.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        run: |
          gh release create "v${NEW_VERSION}" \
            --title "Release v${NEW_VERSION}" \
            --generate-notes \
            --target main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy
          echo "DD_API_KEY=${{ secrets.DATADOG_API_KEY }}" > deploy/.env
          cat > deploy/docker-compose.prod.yaml << 'EOF'
          services:
            frontend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ env.NEW_VERSION }}
              container_name: portfolio-frontend
              environment:
                - DD_SERVICE=ivanildobarauna.dev
                - DD_ENV=production
                - DD_VERSION=1.0.0
                - DD_TRACE_SAMPLE_RATE=1.0
                - DD_AGENT_HOST=localhost
                - DD_PROCESS_AGENT_ENABLED=true
                - DD_TAGS="app:portfolio,tech:nextjs,role:frontend"
              labels:
                com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "ivanildobarauna.dev"}]'
                tags.env: "production"
                tags.service: "ivanildobarauna.dev"
                tags.tech: "nextjs"
                tags.app: "portfolio"
                tags.role: "frontend"
              depends_on:
                - backend
              restart: unless-stopped
              network_mode: host
              healthcheck:
                test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 60s


            backend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ env.NEW_VERSION }}
              container_name: portfolio-backend
              environment:
                - POSTGRES_HOST=localhost
                - DD_SERVICE=api.ivanildobarauna.dev
                - DD_ENV=production
                - DD_VERSION=1.0.0
                - DD_TRACE_SAMPLE_RATE=1.0
                - DD_AGENT_HOST=localhost
                - DD_PROCESS_AGENT_ENABLED=true
                - DD_TAGS="app:portfolio,tech:python,role:backend"
                - DD_RUNTIME_METRICS_ENABLED=true
              labels:
                com.datadoghq.ad.logs: '[{"source": "python", "service": "api.ivanildobarauna.dev"}]'
                tags.env: "production"
                tags.service: "api.ivanildobarauna.dev"
                tags.tech: "python"
                tags.app: "portfolio"
                tags.role: "backend"
              restart: unless-stopped
              network_mode: host
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/ping"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 60s
          EOF

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: site-deploy-bundle
          path: deploy/
          retention-days: 1

  deploy:
    needs: build-and-package
    uses: ivanildobarauna/github-workflows/.github/workflows/deploy-compose-ssh.yml@v1
    with:
      artifact-name: site-deploy-bundle
      compose-file: docker-compose.prod.yaml
      remote-path: /home/ubuntu/app/site
      environment: Production
    secrets:
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
